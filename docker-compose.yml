services:

  backend:

    build:

      context: .

      dockerfile: Dockerfile

    image: mite-lovers-backend:${GIT_COMMIT:-latest}

    ports:

      - "8081:8081"

    environment:

      - SPRING_PROFILES_ACTIVE=prod

    security_opt:

      - no-new-privileges:true

    cap_drop:

      - ALL

    read_only: true

    tmpfs:

      - /tmp

    deploy:

      resources:

        limits:

          cpus: "1.0"

          memory: 512M

    healthcheck:

      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 60s

    restart: unless-stopped


  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

      args:

        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5173}

    image: mite-lovers-frontend:${GIT_COMMIT:-latest}

    ports:

      - "5173:5173"

    security_opt:

      - no-new-privileges:true

    cap_drop:

      - ALL

    deploy:

      resources:

        limits:

          cpus: "0.5"

          memory: 128M

    healthcheck:

      test: ["CMD-SHELL", "wget -qO- http://localhost:5173 || exit 1"]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 10s

    depends_on:

      backend:

        condition: service_healthy

    restart: unless-stopped