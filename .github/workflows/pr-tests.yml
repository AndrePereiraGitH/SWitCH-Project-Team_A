name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - teamA_1
      - teamA_2
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test & enforce coverage (Maven verify)
        run: mvn clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload PITest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports/

  # ── US048 ── SAST with Semgrep + style analysis ─────────────────────────────
  static-analysis-and-security:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Checkstyle (report)
        if: always()
        run: mvn checkstyle:check --no-transfer-progress || true

      - name: PMD (report)
        if: always()
        run: mvn pmd:check --no-transfer-progress || true

      - name: Semgrep SAST scan (gate)
        uses: semgrep/semgrep-action@v1
        with:
          config: >
            p/java
            p/owasp-top-ten
            p/spring
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml

      # Posts a Semgrep severity summary as a PR comment
      - name: Publish Semgrep findings to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            let output;
            try {
              output = execSync(
                'semgrep --config p/java --config p/owasp-top-ten --config p/spring ' +
                '--json --quiet 2>/dev/null || true'
              ).toString();
            } catch (e) {
              output = '{}';
            }

            let results;
            try { results = JSON.parse(output); } catch { results = { results: [] }; }

            const findings = results.results || [];
            const counts = { ERROR: 0, WARNING: 0, INFO: 0 };
            for (const f of findings) {
              const sev = f.extra?.severity || 'INFO';
              counts[sev] = (counts[sev] || 0) + 1;
            }

            const body = [
              '## Semgrep SAST Results',
              '',
              '| Severity | Count |',
              '|----------|-------|',
              `| Error   | ${counts.ERROR}   |`,
              `| Warning | ${counts.WARNING} |`,
              `| Info    | ${counts.INFO}    |`,
              '',
              counts.ERROR > 0
                ? '> **Build blocked**: ERROR severity findings detected.'
                : '> No ERROR severity findings.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ── US049 ── Secret & insecure-configuration detection ──────────────────────
  secret-detection:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan (gate)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ── US053 ── Dependency inventory + vulnerability scan ──────────────────────
  dependency-scan:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Generate dependency inventory
        run: |
          mvn dependency:tree \
              --no-transfer-progress \
              -DoutputFile=target/dependency-tree.txt

      - name: OWASP Dependency-Check (CVE gate)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -DnvdApiKey=${NVD_API_KEY} \
              --no-transfer-progress

      - name: Upload dependency inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: target/dependency-tree.txt

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      # Parses the OWASP report and posts a severity-annotated summary as a PR comment
      - name: Publish OWASP findings to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'target/dependency-check-report.html';
            if (!fs.existsSync(path)) {
              console.log('No OWASP report found');
              return;
            }
            const html = fs.readFileSync(path, 'utf8');

            // Extract CVE counts by severity from the HTML report
            const critical = (html.match(/CRITICAL/g) || []).length;
            const high     = (html.match(/HIGH/g)     || []).length;
            const medium   = (html.match(/MEDIUM/g)   || []).length;
            const low      = (html.match(/LOW/g)      || []).length;

            const body = [
              '## OWASP Dependency-Check Results',
              '',
              '| Severity | Count |',
              '|----------|-------|',
              `| Critical | ${critical} |`,
              `| High     | ${high}     |`,
              `| Medium   | ${medium}   |`,
              `| Low      | ${low}      |`,
              '',
              critical > 0 || high > 0
                ? '> **Build blocked**: HIGH or CRITICAL vulnerabilities detected. See artifact for full report.'
                : '> No HIGH or CRITICAL vulnerabilities found.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ── US057 ── Explicit quality & security gates ──────────────────────────────
  pr-validation:
    runs-on: ubuntu-latest
    needs: [build-and-test, static-analysis-and-security, secret-detection, dependency-scan]
    if: success()

    steps:
      - name: Verify all gates passed
        run: |
          echo "════════════════════════════════════════"
          echo "         INTEGRATION GATE SUMMARY       "
          echo "════════════════════════════════════════"
          echo ""
          echo "Test coverage gates passed"
          echo "     - Line coverage    : ≥ 85% (JaCoCo)"
          echo "     - Mutation coverage: ≥ 95% (PITest)"
          echo ""
          echo " SAST gates passed"
          echo "     - Semgrep (p/java, p/owasp-top-ten, p/spring)"
          echo "     - Checkstyle (reported)"
          echo "     - PMD (reported)"
          echo ""
          echo "Secret detection passed"
          echo "     - Gitleaks (full git history scan)"
          echo ""
          echo "Dependency scan passed"
          echo "     - OWASP Dependency-Check (CVSS threshold: 7)"
          echo ""
          echo "════════════════════════════════════════"
          echo "   PR cleared for merge review          "
          echo "════════════════════════════════════════"