name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - teamA_1
      - teamA_2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn test