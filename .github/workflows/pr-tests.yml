name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - teamA_1
      - teamA_2
      - frontend

  push:
    branches:
      - main
      - teamA_1
      - teamA_2
      - frontend

permissions:
  contents: read
  actions: write

jobs:
  # ── US054 ── Enforce coverage thresholds ────────────────────────────────────
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compiles, runs tests, checks 85% line coverage + 95% mutation coverage
      - name: Build, test & enforce coverage (Maven verify)
        run: mvn clean verify

      # Upload JaCoCo line coverage report
      - name: Upload JaCoCo report
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Upload PITest mutation coverage report
      - name: Upload PITest report
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports/

  # ── US048 ── SAST with Semgrep + style analysis ─────────────────────────────
  static-analysis-and-security:
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Checkstyle: style violations — report only (failOnViolation=false in pom)
      - name: Checkstyle (report)
        if: always()
        run: mvn checkstyle:check --no-transfer-progress || true

      # PMD: code smells — report only (failOnViolation=false in pom)
      - name: PMD (report)
        if: always()
        run: mvn pmd:check --no-transfer-progress || true

      - name: Semgrep SAST scan (gate)
        run: |
          python3 -m pip install semgrep --quiet
          semgrep --config p/java --config p/owasp-top-ten \
                  --error \
                  --metrics=off
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Checkstyle report
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml

      - name: Upload PMD report
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml

      # ── US056 ── Post Semgrep findings with severity to PR ───────────────────
      - name: Publish Semgrep findings to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            let output;
            try {
              output = execSync(
                'semgrep --config p/java --config p/owasp-top-ten --config p/spring ' +
                '--json --quiet 2>/dev/null || true'
              ).toString();
            } catch (e) {
              output = '{}';
            }

            let results;
            try { results = JSON.parse(output); } catch { results = { results: [] }; }

            const findings = results.results || [];
            const counts = { ERROR: 0, WARNING: 0, INFO: 0 };
            for (const f of findings) {
              const sev = f.extra?.severity || 'INFO';
              counts[sev] = (counts[sev] || 0) + 1;
            }

            const body = [
              '## Semgrep SAST Results',
              '',
              '| Severity | Count |',
              '|----------|-------|',
              `|  Error   | ${counts.ERROR}   |`,
              `|  Warning | ${counts.WARNING} |`,
              `|  Info    | ${counts.INFO}    |`,
              '',
              counts.ERROR > 0
                ? '>  **Build blocked**: ERROR severity findings detected.'
                : '>  No ERROR severity findings.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ── US049 ── Secret & insecure-configuration detection ──────────────────────
  secret-detection:
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          # Full history needed so Gitleaks can scan all commits in the PR
          fetch-depth: 0

      # Gitleaks: scans git history for secrets — fails build if any found
      - name: Gitleaks secret scan (gate)
        uses: gitleaks/gitleaks-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── US053 ── Dependency inventory + vulnerability scan ──────────────────────
  dependency-scan:
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Produces a full inventory of all direct + transitive dependencies
      - name: Generate dependency inventory
        run: |
          mvn dependency:tree \
              --no-transfer-progress \
              -DoutputFile=target/dependency-tree.txt

      - name: Check if NVD key is inserted
        run: |
          echo "Key length: ${#NVD_API_KEY}"
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      # OWASP: CVE scan
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: nvd-${{ runner.os }}-

      - name: OWASP Dependency-Check (CVE gate)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
          -DnvdApiKey=${NVD_API_KEY} \
          -DnvdApiDelay=10000 \
          -DossindexAnalyzerEnabled=false \
          -DfailOnError=false \
          --no-transfer-progress

      - name: Upload dependency inventory
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: dependency-tree
          path: target/dependency-tree.txt

      - name: Upload OWASP report
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      # ── US056 ── Post OWASP findings with severity to PR ────────────────────
      - name: Publish OWASP findings to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'target/dependency-check-report.html';
            if (!fs.existsSync(path)) {
              console.log('No OWASP report found');
              return;
            }
            const html = fs.readFileSync(path, 'utf8');

            const critical = (html.match(/CRITICAL/g) || []).length;
            const high     = (html.match(/HIGH/g)     || []).length;
            const medium   = (html.match(/MEDIUM/g)   || []).length;
            const low      = (html.match(/LOW/g)      || []).length;

            const body = [
              '##  OWASP Dependency-Check Results',
              '',
              '| Severity | Count |',
              '|----------|-------|',
              `|  Critical | ${critical} |`,
              `|  High     | ${high}     |`,
              `|  Medium   | ${medium}   |`,
              `|  Low      | ${low}      |`,
              '',
              critical > 0 || high > 0
                ? '> ️ **Build blocked**: HIGH or CRITICAL vulnerabilities detected. See artifact for full report.'
                : '>  No HIGH or CRITICAL vulnerabilities found.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ── US073 ── Container image vulnerability scan ─────────────────────────────
  container-image-scan:
    runs-on: ubuntu-latest
    needs: []
    permissions:
      contents: read
      actions: write
      pull-requests: write

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t mite-lovers-backend:scan .

      - name: Build frontend image
        run: docker build -t mite-lovers-frontend:scan ./frontend

      # Backend — table (for PR comment)
      - name: Trivy scan — backend (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mite-lovers-backend:scan
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          output: trivy-backend.txt

      # Backend — HTML (for artifact)
      - name: Trivy scan — backend (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mite-lovers-backend:scan
          format: template
          template: '@/usr/local/share/trivy/templates/html.tpl'
          exit-code: '0'
          severity: CRITICAL,HIGH
          output: trivy-backend.html

      # Frontend — table (for PR comment)
      - name: Trivy scan — frontend (table)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mite-lovers-frontend:scan
          format: table
          exit-code: '0'
          severity: CRITICAL,HIGH
          output: trivy-frontend.txt

      # Frontend — HTML (for artifact)
      - name: Trivy scan — frontend (HTML)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: mite-lovers-frontend:scan
          format: template
          template: '@/usr/local/share/trivy/templates/html.tpl'
          exit-code: '0'
          severity: CRITICAL,HIGH
          output: trivy-frontend.html

      - name: Upload Trivy backend report
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report
          path: |
            trivy-backend.txt
            trivy-backend.html

      - name: Upload Trivy frontend report
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: trivy-frontend-report
          path: |
            trivy-frontend.txt
            trivy-frontend.html

      - name: Publish Trivy findings to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const backend = fs.existsSync('trivy-backend.txt')
              ? fs.readFileSync('trivy-backend.txt', 'utf8')
              : 'No report generated.';
            const frontend = fs.existsSync('trivy-frontend.txt')
              ? fs.readFileSync('trivy-frontend.txt', 'utf8')
              : 'No report generated.';

            const body = [
              '## Trivy Container Scan Results',
              '',
              '### Backend',
              '```',
              backend.slice(0, 3000),
              '```',
              '',
              '### Frontend',
              '```',
              frontend.slice(0, 3000),
              '```',
              '',
              '> HTML reports available under **Actions → this run → Artifacts** (`trivy-backend-report`, `trivy-frontend-report`)',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ── US051 + US057 ── Aggregated gate + explicit integration criteria ─────────
  pr-validation:
    runs-on: ubuntu-latest
    needs: [build-and-test, static-analysis-and-security, secret-detection, dependency-scan, container-image-scan]
    if: success()
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Verify all gates passed
        run: |
          echo "════════════════════════════════════════"
          echo "         INTEGRATION GATE SUMMARY       "
          echo "════════════════════════════════════════"
          echo ""
          echo "Test coverage gates passed"
          echo "     - Line coverage    : >= 85% (JaCoCo)"
          echo "     - Mutation coverage: >= 95% (PITest)"
          echo ""
          echo "SAST gates passed"
          echo "     - Semgrep (p/java, p/owasp-top-ten, p/spring)"
          echo "     - Checkstyle (reported)"
          echo "     - PMD (reported)"
          echo ""
          echo "Secret detection passed"
          echo "     - Gitleaks (full git history scan)"
          echo ""
          echo "Dependency scan passed"
          echo "     - OWASP Dependency-Check (CVSS threshold: 7)"
          echo ""
          echo "Container scan passed"
          echo "     - Trivy backend  (CRITICAL,HIGH — HTML report uploaded)"
          echo "     - Trivy frontend (CRITICAL,HIGH — HTML report uploaded)"
          echo ""
          echo "════════════════════════════════════════"
          echo "   PR cleared for merge review          "
          echo "════════════════════════════════════════"

      # ── US052 ── Publish consolidated quality summary to PR ─────────────────
      - name: Publish quality summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '##  CI Quality Report — All Gates Passed',
              '',
              '| Job | Gate | Tool |',
              '|-----|------|------|',
              '| build-and-test |  Passed | JaCoCo |',
              '| build-and-test |  Passed | PITest |',
              '| static-analysis-and-security |  Passed | Semgrep |',
              '| static-analysis-and-security |  Reported | Checkstyle |',
              '| static-analysis-and-security |  Reported | PMD |',
              '| secret-detection |  Passed | Gitleaks |',
              '| dependency-scan |  Passed | OWASP |',
              '| container-image-scan |  Reported | Trivy (backend) |',
              '| container-image-scan |  Reported | Trivy (frontend) |',
              '',
              '>  All reports available under **Actions → this run → Artifacts**',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ── US050 ── Versioned artifact generation ──────────────────────────────────
  publish-artifact:
    runs-on: ubuntu-latest
    needs: [pr-validation]
    permissions:
      contents: read
      actions: write

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Stamps the version with the short commit SHA for traceability
      - name: Set version from commit SHA
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          mvn versions:set -DnewVersion="1.0-${SHORT_SHA}" --no-transfer-progress

      # Tests already passed in build-and-test
      - name: Build versioned artifact
        run: mvn package -DskipTests --no-transfer-progress

      - name: Upload versioned JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: target/*.jar
          retention-days: 90