name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - teamA_1
      - teamA_2
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build, test & enforce coverage (Maven verify)
        run: mvn clean verify

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload PITest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports/

  # ── US048 ── Static analysis + security checks ──────────────────────────────
  static-analysis-and-security:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile (no tests)
        run: mvn compile --no-transfer-progress

      - name: Checkstyle (report)
        if: always()
        run: mvn checkstyle:check --no-transfer-progress || true

      - name: PMD (report)
        if: always()
        run: mvn pmd:check --no-transfer-progress || true

      - name: OWASP Dependency-Check (CVE gate)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mvn org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -DnvdApiKey=${NVD_API_KEY} \
              --no-transfer-progress

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: target/checkstyle-result.xml

      - name: Upload PMD report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: target/pmd.xml

      - name: Upload OWASP Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

  # ──── Secret & insecure-configuration detection ──────────────────────
  secret-detection:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Gitleaks
      - name: Gitleaks secret scan (gate)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    # ──── Protected integration rules ────────────────────────────────────

    pr-validation:
      runs-on: ubuntu-latest
      needs: [ build-and-test, static-analysis-and-security, secret-detection ]
      # Only passes if ALL required jobs passed
      if: success()

      steps:
        - name: All quality gates passed
          run: |
            echo "build-and-test passed"
            echo "static-analysis-and-security passed"
            echo "secret-detection passed"
            echo "PR is cleared for merge"