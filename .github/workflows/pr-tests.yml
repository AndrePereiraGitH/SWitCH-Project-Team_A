name: PR Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - teamA_1
      - teamA_2

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Compiles, runs tests, checks 85% line coverage + 95% mutation coverage
      - name: Build, test & enforce coverage (Maven verify)
        run: mvn clean verify

      # Upload JaCoCo line coverage report
      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      # Upload PITest mutation coverage report
      - name: Upload PITest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: target/pit-reports/