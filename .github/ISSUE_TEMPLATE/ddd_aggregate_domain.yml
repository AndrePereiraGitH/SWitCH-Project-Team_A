name: "DDD <Aggregate Name> - Domain Refactor"
description: "Implementation of the Domain Layer (Entities, VOs, and Invariants)"
title: "[DDD] Domain: <Aggregate Name>"
labels: ["sprint4"]
projects: ["MiteLovers"]
assignees: []
body:
  - type: textarea
    id: issue-details
    attributes:
      label: "Issue Details"
      value: |
        ## Domain Layer Implementation (The Core)

        ### Aggregate Root
        - [ ] **Identity:** Aggregate ID implemented as a dedicated Value Object in `domain/valueobjects/`.
        - [ ] **Encapsulation:** All state changes occur through explicit business methods (no public setters).
        - [ ] **Invariants:** Business rules are validated before any state transition.
        - [ ] **External Refs:** Confirmed that references to other aggregates use `ID` only.

        ### Internal Entities
        - [ ] **Locality:** Entities created strictly within the `domain/<aggregateName>/` package.
        - [ ] **Access Control:** Constructors are `protected` or `package-private` to prevent external instantiation.
        - [ ] **Lifecycle:** Managed entirely by the Aggregate Root.

        ### Value Objects (VO)
        - [ ] **Immutability:** All fields are `final`; no setters exist.
        - [ ] **Value Equality:** `equals()` and `hashCode()` are implemented based on attributes.
        - [ ] **Self-Validation:** Constructor throws exceptions if data is invalid (Always Valid state).

        ### Factories
        - [ ] **Aggregate Factory:** Publicly accessible for creating new instances from the Controller/Application layer.
        - [ ] **Internal Factories:** Used for complex entity creation within the aggregate boundary.
        - [ ] **Logic Check:** Factories ensure the Aggregate starts in a valid state.

        ### Repository Contract
        - [ ] **Interface Definition:** Located in `domain/<aggregateName>/`.
        - [ ] **Methods:** Only handles the Aggregate Root — no direct access to internal entities.

        ---

        ## Implementation Details
        <!-- List any specific Value Objects or Business Rules addressed in this PR -->

        ---

        ## Additional Notes
        <!-- Any extra context, design decisions, or references -->
    validations:
      required: true
