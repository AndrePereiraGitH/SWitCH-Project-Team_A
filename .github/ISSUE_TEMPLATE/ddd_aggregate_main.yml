name: "Implementation x aggregate -- DDD refactoring"
description: "Main issue for a Domain Aggregate implementation"
title: "[DDD] Aggregate: <Aggregate Name>"
labels: ["sprint4"]
projects: ["MiteLovers"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## Aggregate Overview
        This issue tracks the complete implementation of the `<Aggregate Name>` aggregate following **Domain-Driven Design (DDD)** principles.
        All related subissues for design, domain logic, repository, and controller refactoring should be linked here.

        The aggregate serves as a **consistency boundary**, ensuring all business invariants are enforced within the domain layer.

        ---

        ## Business Goal
        Explain what this aggregate represents in the business domain and why it is essential.

        ---

        ## Key Domain Invariants
        - The aggregate must always remain in a valid state.
        - Internal entities cannot exist without the Aggregate Root.
        - All business rules must be enforced within the Aggregate Root.
        - External aggregates must be referenced only by ID (Value Object).
        - The aggregate must maintain transactional consistency.

        ---
  - type: textarea
    id: business-context
    attributes:
      label: "Business Goal & Context"
      placeholder: "Describe the 'Why' behind this aggregate..."
    validations:
      required: true