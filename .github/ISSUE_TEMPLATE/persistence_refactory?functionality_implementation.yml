    attributes:
      label: "Issue Details"
      value: |
        ## Overview
        This issue tracks the implementation of the persistence layer for `FUNCTIONALITY`,
        following the approved design artifacts.
        
        The scope is limited to the **creation flow** — from receiving a request to 
        persisting a new domain object and returning the result.

        ---

        ## Scope
        This issue covers the implementation of:
        - **Data Model** — JPA-annotated persistence entities
        - **Assembler / Mapper** — translation between domain and data model
        - **JPA Repository Implementation** — infrastructure layer, orchestrates assembler and Spring Data JPA
        - **Service** — application layer, coordinates domain factory and repository for object creation

        ---

        ## Implementation Checklist

        ### Persistence Layer
        - [ ] Data Model entity implemented with JPA annotations
        - [ ] Assembler implemented to convert domain object → data model entity (save flow)
        - [ ] Assembler implemented to convert data model entity → domain object (reconstruction flow)
        - [ ] Factory implemented to reconstruct domain objects from persisted data
        - [ ] JPA Repository Implementation defined in the persistence Layer

        ### Service
        - [ ] Service delegates instantiation to the Domain Factory
        - [ ] Service delegates persistence to the Repository

        ---

        ## Boundary & Integrity Checklist
        - [ ] **Persistence Ignorance**: no JPA or framework-specific logic in the Domain Layer
        - [ ] **Infrastructure Isolation**: assemblers and JPA repositories remain outside the Domain Layer
        - [ ] **Reconstitution Safety**: reconstruction does not bypass domain consistency rules

        ---

        ## Acceptance Criteria
        - [ ] Implementation matches the approved design artifacts
        - [ ] All new classes are covered by unit tests (TDD)
        - [ ] Test coverage remains at or above the required threshold (≥ 85% line, ≥ 95% mutation)
        - [ ] No JPA/framework annotations exist in the Domain Layer
        - [ ] All public classes and methods are documented with JavaDoc
        - [ ] Code passes Checkstyle and PMD checks (`./lint`)
        - [ ] Build and all tests pass locally (`./run`) before opening a PR

