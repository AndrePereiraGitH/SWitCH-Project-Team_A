name: "Refactor -- Wire Persistence Layer"
description: "Issue: Refactor <FUNCTIONALITY> to use the implemented persistence layer"
title: "Refactor: Wire <FUNCTIONALITY> to persistence layer"
labels: ["sprint5", "refactor"]
projects: ["MiteLovers"]
assignees: []
body:
  - type: textarea
    id: issue-details
    attributes:
      label: "Issue Details"
      value: |
        ## Overview
        This issue tracks the refactoring of `<FUNCTIONALITY>` to use the already implemented
        persistence layer — data model entities, JPA repositories, and assemblers are in place.

        The goal is to replace any in-memory or stub persistence with the real infrastructure,
        ensuring the domain layer remains untouched and all wiring happens at the correct layer.

        ---

        ## Refactoring Checklist

        ### Service
        - [ ] Service injected with the repository implementation (replacing any in-memory dependency).
        - [ ] Service delegates instantiation to the domain factory — no direct constructor calls.
        - [ ] Service delegates persistence to the repository — no direct data model access.

        ### Repository wiring
        - [ ] `RepositoryJPA` implementation injected where the domain repository interface is expected.
        - [ ] No direct references to JPA repositories outside the infrastructure layer.
        
        ---

        ## Boundary & Integrity Verification
        - [ ] Domain layer has zero persistence/framework dependencies after refactor.
        - [ ] No direct references to external aggregate objects — only ID Value Objects used.
        - [ ] Reconstruction from persistence does not bypass domain object constructors or factories.

        ---

        ## Testing Checklist
        - [ ] Existing unit tests still pass after refactor.
    
        ---

        ## Acceptance Criteria
        - [ ] `<FUNCTIONALITY>` uses the real persistence layer end-to-end.
        - [ ] Domain layer is free of any persistence/framework concerns.
        - [ ] All tests pass.
        - [ ] Refactor reviewed and approved by at least one team member.

        ---

        ## Additional Notes
        <!-- Any blockers, decisions, or context specific to this refactor. -->
    validations:
      required: true