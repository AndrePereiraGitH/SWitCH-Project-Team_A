name: Repository Interface Implementation
description: Implement and test a Repository Interface following OOD best practices
title: "Implement [RepositoryName] Repository Interface"
labels: ["sprint4"]

body:
  - type: input
    id: repository_name
    attributes:
      label: Repository Name
      description: The name of the repository interface to implement
      placeholder: "e.g. UserRepository, ProductRepository"
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: Issue Details
      value: |
        ## Description
        Implement the **[RepositoryName]** to abstract and standardize data access operations,
        following object-oriented design (OOD) best practices and the chosen design pattern.

        ---

        ## Acceptance Criteria

        ### Implementation
        - [ ] The implementation correctly fulfills the [RepositoryName] contract
        - [ ] All methods delegate data access operations appropriately to the underlying data source
        - [ ] The implementation is documented using JavaDoc

        ### Testing
        - [ ] All interface methods are covered by unit tests
        - [ ] All edge cases are handled and tested (e.g., null inputs, empty results, duplicate entries)
        - [ ] Test coverage is ≥ 95%

        ### Review
        - [ ] The code is reviewed and approved by at least one team member

        ---

        ## Additional Notes
        <!-- Any extra context, design decisions, or references -->
    validations:
      required: true