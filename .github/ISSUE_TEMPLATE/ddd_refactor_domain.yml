    attributes:
      label: "Issue Details"
      value: |
        ## Aggregate Overview
        This issue tracks the Domain Layer restructure of the `<Aggregate Name>` aggregate to comply with the **Domain-Driven Design (DDD)** principles established during the previous refactoring.

        ---

        ## Business Goal
        Explain what domain elements need to be restructured and why they must change to respect DDD principles.

        ---

        ## Required Files

        Each aggregate package under `domain/` must include the following files:

        | File / Class                        | Description                                              | Status |
        |-------------------------------------|----------------------------------------------------------|--------|
        | `<AggregateName>.java`              | Aggregate root domain class + owned entities             | [ ]    |
        | `<AggregateName>Factory.java`       | Factory responsible for creating instances               | [ ]    |
        | `I<AggregateName>Repository.java`   | Repository interface (omit if no repository)             | [ ]    |

        > All files must live under `src/domain/<aggregateName>/` following the project's DDD-layered structure.

        ---

        ## Key Domain Invariants
        - The Aggregate Root must encapsulate all state changes through explicit business methods (no public setters).
        - All business rules must be validated before any state transition.
        - Internal entities cannot be instantiated outside the aggregate boundary.
        - All Value Objects must be immutable and self-validating.
        - External aggregates must be referenced only by ID (Value Object).
        - The aggregate must maintain transactional consistency.

        ---

        ## Breaking Changes
        <!-- List any structural changes that may impact other aggregates or the broader architecture. -->

        > Breaking change: _describe what was removed/changed and what needs to be updated across the codebase._

        ---

        ## Acceptance Criteria
        - [ ] Aggregate Root correctly encapsulates all invariants and state transitions.
        - [ ] All Value Objects are immutable and self-validating.
        - [ ] No direct references to other aggregate objects — only IDs (Value Objects) are used.
        - [ ] Marker interfaces from `src/ddd/` are correctly implemented (`AggregateRoot`, `DomainEntity`, `ValueObject`, or `DomainID`).
        - [ ] Aggregate ID is a Value Object placed in `domain/valueobjects/`.
        - [ ] Repository interface (if any) is scoped to the Domain Layer only.
        - [ ] Code is documented with JavaDoc.
        - [ ] Test coverage ≥ 95%.
        - [ ] Changes are reviewed and approved by the team (at least one team member).

        ---

        ## Additional Notes
        <!-- Any extra context, design decisions, blockers, or references. -->
    validations:
      required: true
