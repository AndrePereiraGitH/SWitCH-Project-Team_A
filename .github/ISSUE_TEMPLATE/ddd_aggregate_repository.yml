name: "DDD <Aggregate Name> - Repository Refactor"
description: "Infrastructure layer implementation for Aggregate persistence"
title: "[DDD] Repository: <Aggregate Name>"
labels: ["sprint4"]
projects: ["MiteLovers"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ##  Repository Implementation (Infrastructure)
        > **Constraint:** This layer must bridge the gap between the Domain Model and the Database without introducing side effects.

        ### Implementation Checklist
        - [ ] **Interface Compliance:** Implementation strictly follows the contract defined in `domain/<aggregateName>/`.
        - [ ] **Aggregate-Centric:** The repository only handles the **Aggregate Root**; internal entities are never accessed or saved independently.
        - [ ] **Atomic Persistence:** Verified that saving the Root persists the entire entity tree (cascading saves/updates) in a single operation.
        - [ ] **Zero Business Logic:** Confirmed that the repository contains no `if/else` logic related to domain invariants.
        
  - type: textarea
    id: infrastructure-notes
    attributes:
      label: "Infrastructure Details"
      placeholder: "Mention specific database constraints, mapper details, or performance considerations here..."
    validations:
      required: false
